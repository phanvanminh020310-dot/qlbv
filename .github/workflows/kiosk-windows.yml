name: Kiosk standalone quality gate

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the verified Windows package to GitHub Releases (main only)
        type: boolean
        default: false
      release_tag:
        description: Component release tag matching the package version
        type: string
        default: kiosk-v2.0.3
        required: true
  push:
    branches: [main]
    paths:
      - "deploy/windows/**"
      - "backend/src/modules/kiosk/**"
      - "backend/src/modules/duty/**"
      - "backend/drizzle/**"
      - "backend/test/duty*.test.ts"
      - "frontend/src/components/duty/**"
      - "frontend/src/app/(app)/lich-truc/**"
      - "deploy/update.sh"
      - "deploy/test_update.py"
      - "backend/src/modules/settings/**"
      - "backend/test/kiosk*.test.ts"
      - "backend/scripts/verify-kiosk-qr.cjs"
      - "backend/scripts/prepare_kiosk_release.py"
      - "backend/scripts/test_prepare_kiosk_release.py"
      - "frontend/src/app/kiosk/**"
      - "frontend/src/app/scan/**"
      - "frontend/src/app/(app)/quan-tri/cau-hinh/**"
      - ".github/workflows/kiosk-windows.yml"
  pull_request:
    paths:
      - "backend/scripts/prepare_kiosk_release.py"
      - "backend/scripts/test_prepare_kiosk_release.py"
      - "deploy/windows/**"
      - "backend/src/modules/kiosk/**"
      - "backend/src/modules/duty/**"
      - "backend/drizzle/**"
      - "backend/test/duty*.test.ts"
      - "frontend/src/components/duty/**"
      - "frontend/src/app/(app)/lich-truc/**"
      - "deploy/update.sh"
      - "deploy/test_update.py"
      - "backend/test/kiosk*.test.ts"
      - "frontend/src/app/kiosk/**"
      - "frontend/src/app/scan/**"
      - "frontend/src/app/(app)/quan-tri/cau-hinh/**"
      - ".github/workflows/kiosk-windows.yml"

permissions:
  contents: read

jobs:
  server-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: backend
      - name: Test release validation without network or credentials
        run: python3 -m unittest discover -s scripts -p 'test_prepare_kiosk_release.py' -v
        working-directory: backend
      - name: Verify accepted native baseline and all-account runtime policy
        run: python3 -m unittest discover -s deploy/windows/tests -p 'test_pin_scope.py' -v
      - name: Verify upgrade backup failure and config preservation
        run: python3 -m unittest discover -s deploy -p 'test_update.py' -v
      - run: npm run typecheck && npm test && npm run build
        working-directory: backend

  phone-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm run typecheck && npm run build
        working-directory: frontend

  windows-package:
    runs-on: windows-latest
    needs: [server-regression, phone-and-web]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: backend
      - name: Compile with the actual inbox .NET Framework C# compiler
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Join-Path $env:RUNNER_TEMP 'QLBS_Kiosk'
          New-Item -ItemType Directory -Force $package | Out-Null
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          # The inbox compiler interprets forward slashes in source arguments as option separators.
          # Resolve an absolute Windows path and pass each compiler argument as one array item.
          $source = (Resolve-Path -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'deploy\windows\QLBS_Kiosk.cs')).ProviderPath
          $compileArgs = @(
            '/nologo', '/codepage:65001', '/langversion:5', '/target:winexe',
            '/platform:anycpu', '/optimize+', '/warnaserror+',
            "/out:$package\QLBS_Kiosk.exe",
            '/reference:System.dll,System.Core.dll,System.Drawing.dll,System.Windows.Forms.dll,System.Web.Extensions.dll',
            $source
          )
          & $csc @compileArgs
          if ($LASTEXITCODE -ne 0) { throw 'Windows compilation failed' }
          Copy-Item deploy/windows/QLBS_Kiosk.cs,deploy/windows/cai_dat_kiosk.bat,deploy/windows/go_bo_kiosk.bat,deploy/windows/README.md,deploy/windows/HUONG_DAN_SU_DUNG.md,deploy/windows/KIEM_THU_V2.md,deploy/windows/NOTICE.md $package
          "QLBS Kiosk 2.0.3`nSource commit: $env:GITHUB_SHA`nCompiler: $csc`nBuild: Windows CI / .NET Framework / C# 5`nAuthenticode: unsigned; hospital code-signing can be applied before distribution." | Set-Content "$package\BUILD_INFO.txt" -Encoding utf8
      - name: Native self-tests and off-screen WinForms rendering
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'QLBS_Kiosk'
          $qa = Join-Path $env:RUNNER_TEMP 'kiosk-qa'
          New-Item -ItemType Directory -Force $qa | Out-Null
          $p = Start-Process "$package\QLBS_Kiosk.exe" -ArgumentList @('/self-test', '/output', $qa) -RedirectStandardOutput "$qa\native-selftest.stdout.log" -RedirectStandardError "$qa\native-selftest.stderr.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) {
            Get-Content "$qa\native-selftest.stdout.log", "$qa\native-selftest.stderr.log" -ErrorAction SilentlyContinue
            throw 'Native self-tests failed'
          }
          node backend/scripts/verify-kiosk-qr.cjs "$qa\qr-matrices.json"
          if ($LASTEXITCODE -ne 0) { throw 'Independent QR verification failed' }
          foreach ($state in @('qr', 'scanned')) {
            $args = @('/snapshot', "$qa\$state.png")
            if ($state -eq 'scanned') { $args += '/scanned' }
            $p = Start-Process "$package\QLBS_Kiosk.exe" -ArgumentList $args -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Rendering failed: $state" }
          }
      - name: Real keyboard input through the IT button and hotkey, with the production hook and modal
        run: |
          $ErrorActionPreference = 'Stop'
          $qa = Join-Path $env:RUNNER_TEMP 'kiosk-qa'
          $fixture = Join-Path $qa 'PinInputTest.exe'
          $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          $source = (Resolve-Path -LiteralPath 'deploy\windows\QLBS_Kiosk.cs').ProviderPath
          $testSource = (Resolve-Path -LiteralPath 'deploy\windows\tests\PinInputTest.cs').ProviderPath
          & $csc '/nologo' '/codepage:65001' '/langversion:5' '/warnaserror+' '/target:exe' '/platform:anycpu' '/define:KIOSK_INPUT_TEST' '/main:QLBS.Kiosk.PinInputTests' "/out:$fixture" '/reference:System.dll,System.Core.dll,System.Drawing.dll,System.Windows.Forms.dll,System.Web.Extensions.dll' $source $testSource
          if ($LASTEXITCODE -ne 0) { throw 'PIN integration fixture did not compile' }
          $p = Start-Process $fixture -ArgumentList @($qa) -RedirectStandardOutput "$qa\pin-input.stdout.log" -RedirectStandardError "$qa\pin-input.stderr.log" -PassThru
          if (-not $p.WaitForExit(35000)) { $p.Kill(); throw 'PIN fixture hung; do not ship this build' }
          if ($p.ExitCode -ne 0) {
            Get-Content "$qa\pin-input.stdout.log", "$qa\pin-input.stderr.log" -ErrorAction SilentlyContinue
            throw 'Actual keyboard input / shortcut protection test failed'
          }
          Get-Content "$qa\pin-input.txt"
      - name: Parse the embedded recovery script without executing destructive operations
        run: |
          $text = [IO.File]::ReadAllText((Resolve-Path deploy/windows/go_bo_kiosk.bat))
          $marker = '#--QLBS-RECOVERY-POWERSHELL--'
          $script = $text.Substring($text.LastIndexOf($marker) + $marker.Length)
          $tokens = $null; $errors = $null
          [Management.Automation.Language.Parser]::ParseInput($script, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
          $qa = Join-Path $env:RUNNER_TEMP 'kiosk-qa'
          [Management.Automation.Language.Parser]::ParseFile("$qa/deferred-uninstall.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
      - name: Source-only BAT compile and safe failure path
        run: |
          & cmd.exe /d /c 'deploy\windows\cai_dat_kiosk.bat /server invalid-origin /room PK01 /quiet /no-start'
          if ($LASTEXITCODE -ne 1) { throw 'Invalid configuration must fail before installing anything' }
          $global:LASTEXITCODE = 0
      - name: Package with checksums
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'QLBS_Kiosk'
          Get-ChildItem $package -File | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content "$package\SHA256SUMS.txt" -Encoding ascii
          Compress-Archive -Path "$package\*" -DestinationPath "$env:RUNNER_TEMP\QLBS_Kiosk_2.0.3.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: QLBS-Kiosk-Windows-2.0.3
          path: |
            ${{ runner.temp }}/QLBS_Kiosk_2.0.3.zip
            ${{ runner.temp }}/kiosk-qa/self-test.txt
            ${{ runner.temp }}/kiosk-qa/pin-input.txt
            ${{ runner.temp }}/kiosk-qa/qr.png
            ${{ runner.temp }}/kiosk-qa/scanned.png
          if-no-files-found: error

  publish-release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main'
    needs: [server-regression, phone-and-web, windows-package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    concurrency:
      group: kiosk-release-${{ inputs.release_tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v5
        with:
          name: QLBS-Kiosk-Windows-2.0.3
          path: release-artifact
      - name: Verify the exact CI build and prepare release assets
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 backend/scripts/prepare_kiosk_release.py \
            --source release-artifact --destination release-assets \
            --tag "$RELEASE_TAG" --sha "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" --run-url "$CI_RUN_URL"
      - name: Publish only after all verified assets are uploaded
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PROMPT_DISABLED: "1"
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release already exists; refusing to replace published assets."
            exit 1
          fi
          assets=(release-assets/*.zip release-assets/*.exe release-assets/*.sha256)
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft \
            --title "QLBS Kiosk ${RELEASE_TAG#kiosk-v} — Windows" \
            --notes-file release-assets/release-notes.md
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          echo "## QLBS Kiosk Windows đã phát hành" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
